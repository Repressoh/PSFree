name: Docker image

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and check website
        shell: bash
        run: |
          set -euo pipefail
          docker build -t psfree:test .
          docker run --rm psfree:test nginx -t
          docker run -d --name psfree-test -p 127.0.0.1:8080:80 psfree:test
          trap 'docker logs psfree-test; docker rm -f psfree-test' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:8080/ -o /tmp/index.html
          cmp index.html /tmp/index.html
          curl --fail -sSI http://127.0.0.1:8080/alert.mjs | grep -i 'content-type: application/javascript'
          curl --fail -sSI http://127.0.0.1:8080/psfree_lapse.cache | grep -i 'content-type: text/cache-manifest'
          # Check every offline-cache asset, including binary payloads and modules.
          sed -n '/^about.html$/,/^NETWORK:/{ /^NETWORK:/d; p; }' psfree_lapse.cache | tr '\\' '/' | while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            curl --fail -sS "http://127.0.0.1:8080/$asset" -o /tmp/asset
            cmp "$asset" /tmp/asset
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing-file)" = 404

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
