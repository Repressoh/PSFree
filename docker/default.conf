server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location ~ \.cache$ {
        types { text/cache-manifest cache; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
